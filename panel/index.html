    <title>Panel | Operando</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #050505 0%, #0b0b0b 100%);
      }
      body[data-booting='true'] {
        overflow: hidden;
      }
      #app {
        min-height: 100vh;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background: repeating-linear-gradient(0deg, #080808 0 53px, #151515 54px 55px);
        color: #f3f4f6;
        font-family: Inter, Arial, sans-serif;
        z-index: 9999;
      }
      .boot-card {
        display: grid;
        justify-items: center;
        gap: 13px;
        text-align: center;
      }
      .boot-card strong {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.06em;
      }
      .boot-card strong img { width: 32px; height: 32px; object-fit: contain; }
      .boot-card strong b { color: #ed211b; }
      .boot-card::after {
        width: 112px;
        height: 2px;
        background: linear-gradient(90deg, #ed211b 0 35%, #f4f4ef 35% 55%, #ed211b 55% 100%);
        content: '';
        animation: boot-flow 1.2s ease-in-out infinite;
      }
      @keyframes boot-flow { 50% { transform: scaleX(.42); opacity: .55; } }
      .boot-card.is-error strong {
        color: #ff5a4f;
      }
    </style>
  </head>
  <body data-booting="true">
    
    <div id="app"></div>
    <div id="boot-status" aria-label="Preparando acceso">
      <div class="boot-card">
        <strong><img src="/operando-logo.png" alt="" />operando<b>.app</b></strong>
      </div>
    </div>
    <script>
      window.__operandoEntry = "panel";
      window.__operandoAppEntry = true;
      window.__operandoBooted = false;
      window.__operandoBootError = null;
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      } catch (error) {}
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.addEventListener('error', function (event) {
        window.__operandoBootError = event && event.message ? event.message : 'Error inesperado al iniciar la aplicacion.';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        window.__operandoBootError = reason && reason.message ? reason.message : 'Fallo una promesa al iniciar la aplicacion.';
      });
      window.addEventListener('pageshow', function () {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      });
      window.setTimeout(function () {
        if (window.__operandoBooted) return;
        var shell = document.getElementById('boot-status');
        if (!shell) return;
        var message = window.__operandoBootError || 'La aplicacion no termino de cargar. Proba recargar con Ctrl + F5.';
        shell.innerHTML = '<div class="boot-card is-error"><strong>No se pudo iniciar</strong><p>' + message + '</p><p>Si sigue igual, avisame y reviso el error puntual.</p></div>';
      }, 4000);
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <script type="module" src="/app.js?v=e108703"></script>
  </body>
</html>
