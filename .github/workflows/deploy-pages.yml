name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Marketing metrics come from committed site/marketing-metrics.json.
      # Do NOT sync from Supabase here — SUPABASE_SERVICE_ROLE_KEY must not be in Pages CI.
      # Optional local/ops sync: npm run sync:marketing-metrics (with env outside CI Pages).

      - name: Build site
        run: npm run build
        env:
          # El ID público del contenedor se inyecta durante el build estático.
          OPERANDO_GTM_ID: ${{ vars.OPERANDO_GTM_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
