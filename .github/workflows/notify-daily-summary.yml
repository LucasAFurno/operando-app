name: Notify Operational Summaries

on:
  schedule:
    - cron: '0 12 * * 1-4'
    - cron: '0 12 * * 5'
    - cron: '0 12 28-31 * *'
  workflow_dispatch:
    inputs:
      period:
        description: Período a resumir
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fiscal-server/package-lock.json
      - name: Install fiscal dependencies
        working-directory: fiscal-server
        run: npm ci
      - name: Send summary
        working-directory: fiscal-server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPERANDO_CONTROL_DISCORD_ENABLED: ${{ vars.OPERANDO_CONTROL_DISCORD_ENABLED }}
          OPERANDO_CONTROL_DISCORD_RESUMEN_WEBHOOK_URL: ${{ secrets.OPERANDO_CONTROL_DISCORD_RESUMEN_WEBHOOK_URL }}
          OPERANDO_CONTROL_TELEGRAM_ENABLED: ${{ vars.OPERANDO_CONTROL_TELEGRAM_ENABLED }}
          OPERANDO_CONTROL_TELEGRAM_BOT_TOKEN: ${{ secrets.OPERANDO_CONTROL_TELEGRAM_BOT_TOKEN }}
          OPERANDO_CONTROL_TELEGRAM_CHAT_ID: ${{ secrets.OPERANDO_CONTROL_TELEGRAM_CHAT_ID }}
          NOTIFICATIONS_ENVIRONMENT: ${{ vars.NOTIFICATIONS_ENVIRONMENT }}
          SUMMARY_PERIOD: ${{ inputs.period || (github.event.schedule == '0 12 * * 5' && 'weekly') || (github.event.schedule == '0 12 28-31 * *' && 'monthly') || 'daily' }}
          SUMMARY_REQUIRE_MONTH_END: ${{ github.event.schedule == '0 12 28-31 * *' }}
        run: npm run notify:summary -- --period="$SUMMARY_PERIOD"
