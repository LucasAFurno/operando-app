name: Notify Cloud Run Status

on:
  schedule:
    - cron: '1 12 * * 1-4'
    - cron: '1 12 * * 5'
    - cron: '1 12 28-31 * *'
  workflow_dispatch:
    inputs:
      period:
        description: Período a resumir
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fiscal-server/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install fiscal dependencies
        working-directory: fiscal-server
        run: npm ci
      - name: Send Cloud Run status
        working-directory: fiscal-server
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_RUN_SERVICE: pclaf-fiscal
          CLOUD_RUN_REGION: us-central1
          PCLAF_CONTROL_DISCORD_ENABLED: ${{ vars.PCLAF_CONTROL_DISCORD_ENABLED }}
          PCLAF_CONTROL_DISCORD_GCP_RUN_WEBHOOK_URL: ${{ secrets.PCLAF_CONTROL_DISCORD_GCP_RUN_WEBHOOK_URL }}
          PCLAF_CONTROL_DISCORD_LOGS_WEBHOOK_URL: ${{ secrets.PCLAF_CONTROL_DISCORD_LOGS_WEBHOOK_URL }}
          PCLAF_CONTROL_DISCORD_ALERTAS_WEBHOOK_URL: ${{ secrets.PCLAF_CONTROL_DISCORD_ALERTAS_WEBHOOK_URL }}
          SUMMARY_REQUIRE_MONTH_END: ${{ github.event.schedule == '1 12 28-31 * *' }}
        run: npm run notify:gcp-run -- --period="${{ inputs.period || (github.event.schedule == '1 12 * * 5' && 'weekly') || (github.event.schedule == '1 12 28-31 * *' && 'monthly') || 'daily' }}"
