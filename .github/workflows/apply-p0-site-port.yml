name: Apply P0 site UI port patches
on:
  push:
    branches: ['fix/p0-site-ui-cloud-mutations']
    paths:
      - 'scripts/patches/p0-site/**'
      - '.github/workflows/apply-p0-site-port.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Restore baselines and apply Camino P0 patches
        run: |
          set -euo pipefail
          git show ac68791ae08b7879bf157f69f273a2cbc2f55a16:scripts/build.mjs > scripts/build.mjs
          git show ac68791ae08b7879bf157f69f273a2cbc2f55a16:site/data-store.js > site/data-store.js
          git show ac68791ae08b7879bf157f69f273a2cbc2f55a16:site/client.js > site/client.js
          patch -p1 < scripts/patches/p0-site/build.patch
          patch -p1 < scripts/patches/p0-site/data-store.patch
          patch -p1 < scripts/patches/p0-site/client.patch
          grep -n "cloudMutationsJs" scripts/build.mjs | head
          grep -n "wireDataStoreCloudMutations" site/data-store.js | head
          grep -n "await store.createStockAdjustment" site/client.js | head
          grep -n "await store.cancelSale" site/client.js | head
          test -s scripts/build.mjs
          ! grep -qx 'PLACEHOLDER' scripts/build.mjs
      - name: Commit restored site port files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(ui): wire site data-store + form awaits + build emit cloud-mutations'
          file_pattern: scripts/build.mjs site/data-store.js site/client.js
